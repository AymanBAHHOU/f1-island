appId: io.github.aymanbahhou.f1-island
productName: F1 Island
asar: true
directories:
  output: dist
  buildResources: build
# Where the app looks for newer versions (electron-updater reads latest.yml
# from the GitHub release; nothing is published by the build itself).
publish:
  provider: github
  owner: AymanBAHHOU
  repo: f1-island
files:
  - main.js
  - preload.js
  - src/**/*
  - renderer/**/*
  - LICENSE
  - package.json
mac:
  extraResources:
    - from: build/notch-info
      to: notch-info
  category: public.app-category.sports
  minimumSystemVersion: '12.0'
  icon: build/icon.png
  # Ad-hoc signing makes local Apple Silicon builds launchable. Public releases
  # must override this with a Developer ID and enable notarization (see README).
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSHighResolutionCapable: true
    NSPrefersDisplaySafeAreaCompatibilityMode: false
  artifactName: 'F1-Island-${version}-mac-${arch}.${ext}'
dmg:
  title: F1 Island
  contents:
    - x: 130
      y: 160
      type: file
    - x: 410
      y: 160
      type: link
      path: /Applications

# ---------- Windows ----------
# Unsigned for now: Windows SmartScreen warns on first run until the app is
# signed with a code-signing certificate (see README).
win:
  icon: build/icon.png # electron-builder converts it to .ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  # Assisted installer: choose the folder, per-user by default (no admin).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: F1 Island
  # No spaces: GitHub renames spaces to dots when files are uploaded, and the
  # updater then can't find the file named in latest.yml.
  artifactName: 'F1-Island-${version}-win-setup.${ext}'
portable:
  artifactName: 'F1-Island-${version}-win-portable.${ext}'
