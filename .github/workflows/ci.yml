name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Syntax & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Electron 38 runs Node 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The checks don't launch the app; skip Electron's ~100 MB binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
