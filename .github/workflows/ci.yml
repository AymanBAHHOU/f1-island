name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Syntax & tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Electron 38 runs Node 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The checks don't launch the app; skip Electron's ~100 MB binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  mac-build:
    name: macOS app build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ad-hoc signed app
        run: npm run pack:mac:dir
      - name: Archive app bundle preserving executable bits and symlinks
        run: ditto -c -k --sequesterRsrc --keepParent dist/mac*/"F1 Island.app" dist/f1-island-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: f1-island-macos-app
          # Zip the bundle first to preserve executable bits and symlinks.
          path: dist/f1-island-macos.zip

  windows-build:
    name: Windows app build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable app (unsigned)
        run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: f1-island-windows
          path: |
            dist/*-win-setup.exe
            dist/*-win-portable.exe
          if-no-files-found: error
